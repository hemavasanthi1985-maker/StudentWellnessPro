<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counsellor Login | Student Wellness</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body>

    <header class="main-header">

        <div class="container">

            <h2>Student Wellness</h2>

            <nav>
                <a href="../index.html">Home</a>
                <a href="../student/login.html">Student Login</a>
            </nav>

        </div>

    </header>


    <main class="form-page">

        <div class="form-container">

            <h1>Counsellor Login</h1>

            <p class="form-subtitle">
                Login to manage student support cases.
            </p>


            <form id="counsellorLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter counsellor email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary">

                    Login

                </button>


                <p id="message"></p>

            </form>


            <p class="form-footer">

                Authorized counsellors only.

            </p>

        </div>

    </main>


    <script
        type="module"
        src="../js/counsellor-login.js">
    </script>

</body>

</html>
