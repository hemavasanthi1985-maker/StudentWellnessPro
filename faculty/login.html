<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty Login | Student Wellness</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/forms.css">

</head>

<body>

    <header class="main-header">

        <div class="container">

            <h2>Student Wellness</h2>

            <nav>

                <a href="../index.html">
                    Home
                </a>

                <a href="../student/login.html">
                    Student Login
                </a>

            </nav>

        </div>

    </header>


    <main class="form-page">

        <div class="form-container">

            <h1>Faculty Login</h1>

            <p class="form-subtitle">
                Login to manage student referrals and
                academic concerns.
            </p>


            <form id="facultyLoginForm">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter faculty email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary">

                    Login

                </button>


                <p id="message"></p>

            </form>


            <p class="form-footer">

                Authorized faculty only.

            </p>

        </div>

    </main>


    <script
        type="module"
        src="../js/faculty-login.js">
    </script>

</body>

</html>
